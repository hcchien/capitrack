<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="簡潔、私密、在本機運行的投資組合紀錄工具">
  <title>CapiTrack｜投資組合紀錄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#"><span class="brand-mark">C</span><span>CapiTrack</span></a>
      <nav aria-label="主要導覽">
        <button class="nav-item active" data-view="overview"><span>⌂</span>投資總覽</button>
        <button class="nav-item" data-view="transactions"><span>↕</span>交易紀錄</button>
        <button class="nav-item" data-view="review"><span>◎</span>投資 Review</button>
      </nav>
      <div class="privacy"><span class="status-dot"></span><div><strong>只存在這台電腦</strong><small>資料儲存於本機 SQLite</small></div></div>
    </aside>

    <main>
      <header class="topbar">
        <div><p class="eyebrow" id="eyebrow">PORTFOLIO OVERVIEW</p><h1 id="pageTitle">投資總覽</h1></div>
        <button class="primary" id="addTrade">＋ 新增交易</button>
      </header>

      <section id="overview" class="view active-view">
        <div class="hero-card">
          <div><p>目前總資產</p><h2 id="totalValue">NT$ 0</h2><div id="totalPnl" class="change neutral">尚無損益</div></div>
          <div class="hero-meta"><div><span>投入成本</span><strong id="totalCost">NT$ 0</strong></div><div><span>已實現損益</span><strong id="realized">NT$ 0</strong></div></div>
          <div class="orb" aria-hidden="true"></div>
        </div>
        <div class="section-heading"><div><p class="eyebrow">YOUR ASSETS</p><h3>目前持股</h3></div><span id="holdingCount" class="count">0 個項目</span></div>
        <div id="holdings" class="holdings-grid"></div>
      </section>

      <section id="transactions" class="view">
        <div class="filterbar">
          <label>投資標的<select id="filterSymbol"><option value="">全部標的</option></select></label>
          <label>開始日期<input type="date" id="filterFrom"></label>
          <label>結束日期<input type="date" id="filterTo"></label>
          <button class="secondary" id="clearFilters">清除篩選</button>
        </div>
        <div class="table-card"><table><thead><tr><th>日期</th><th>標的</th><th>類型</th><th>數量</th><th>成交價</th><th>總額</th><th></th></tr></thead><tbody id="transactionRows"></tbody></table></div>
      </section>

      <section id="review" class="view">
        <div class="review-intro"><p class="eyebrow">DECISION REVIEW</p><h2>回頭看，每一筆選擇。</h2><p>用時間與標的重新閱讀自己的投資決策，而不只看最終漲跌。</p></div>
        <div id="reviewList" class="review-list"></div>
      </section>
    </main>
  </div>

  <dialog id="tradeDialog">
    <form id="tradeForm">
      <div class="dialog-head"><div><p class="eyebrow">TRANSACTION</p><h2 id="dialogTitle">新增交易</h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="關閉">×</button></div>
      <input type="hidden" id="tradeId">
      <div class="type-toggle"><label><input type="radio" name="type" value="buy" checked><span>買入</span></label><label><input type="radio" name="type" value="sell"><span>賣出</span></label></div>
      <div class="form-grid">
        <label>代號<input id="symbol" required placeholder="例如：2330"></label>
        <label>名稱<input id="name" required placeholder="例如：台積電"></label>
        <label>數量<input id="quantity" required type="number" min="0.000001" step="any" placeholder="0"></label>
        <label>每單位價格<input id="price" required type="number" min="0" step="any" placeholder="0"></label>
        <label>交易日期<input id="tradedAt" required type="date"></label>
        <label>手續費<input id="fee" type="number" min="0" step="any" value="0"></label>
        <label class="full">當時的想法／備註<textarea id="note" rows="3" placeholder="為什麼做這筆交易？"></textarea></label>
      </div>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancelDialog">取消</button><button type="submit" class="primary">儲存交易</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
